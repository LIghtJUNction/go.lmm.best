server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name go.lmm.best;
    access_log off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name go.lmm.best;

    root /var/www/go.lmm.best/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/go.lmm.best/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/go.lmm.best/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /healthz {
        default_type text/plain;
        try_files /healthz =503;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/go-lmm-best-security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/go-lmm-best-security-headers.conf;
    }

    location ^~ /assets/ {
        # Hashed assets are retained in a shared immutable store so clients that
        # loaded the previous index can finish fetching after a release switch.
        root /var/www/go.lmm.best/shared;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/go-lmm-best-security-headers.conf;
    }

    location ~* \.(?:png|svg|webmanifest)$ {
        try_files $uri =404;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/go-lmm-best-security-headers.conf;
    }

    location ~ /\. {
        deny all;
    }

    include /etc/nginx/snippets/go-lmm-best-backend-locations.conf;

    location ~ "^/watch/[A-Za-z0-9_-]{32}/?$" {
        access_log off;
        try_files $uri /index.html =404;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/go-lmm-best-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/go-lmm-best-security-headers.conf;
    }

    include /etc/nginx/snippets/go-lmm-best-security-headers.conf;
}
