# Include this file inside the TLS server block for go.lmm.best, before the
# generic `location /` block. These locations do not intercept static assets.

location = /api/v1/ws {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # This exact route only supports WebSocket; never forward an arbitrary
    # client Upgrade value (in particular, h2c) to the upstream.
    proxy_set_header Upgrade "websocket";
    proxy_set_header Connection "upgrade";

    proxy_cache off;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 64k;
    proxy_connect_timeout 5s;
    proxy_send_timeout 1h;
    proxy_read_timeout 1h;
    add_header Cache-Control "no-store" always;
}

location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_cache off;
    proxy_buffering off;
    client_max_body_size 2m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
}
