# Include this file inside the TLS server block for go.lmm.best, before the
# generic `location /` block. These locations do not intercept static assets.

# Share IDs are bearer-like viewing capabilities. Keep them out of access logs.
location ~ "^/api/v1/shares/[A-Za-z0-9_-]{32}/events$" {
    access_log off;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_cache off;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 1k;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 1h;
    add_header Cache-Control "no-store" always;
    add_header X-Accel-Buffering "no" always;
    include /etc/nginx/snippets/go-lmm-best-security-headers.conf;
}

location ~ "^/api/v1/shares/[A-Za-z0-9_-]{32}(?:/heartbeat)?$" {
    access_log off;
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_cache off;
    proxy_buffering off;
    client_max_body_size 256k;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/go-lmm-best-security-headers.conf;
}

location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    proxy_cache off;
    proxy_buffering off;
    client_max_body_size 256k;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
    include /etc/nginx/snippets/go-lmm-best-security-headers.conf;
}
