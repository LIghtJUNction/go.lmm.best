# Installed as /etc/nginx/conf.d/go-lmm-performance.conf
keepalive_timeout 65;
keepalive_requests 1000;

# Releases are activated by switching /var/www/go.lmm.best/current. Keeping
# descriptors cached across that symlink swap can serve a mixed old/new build.
open_file_cache off;

gzip_static on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
  application/javascript
  application/json
  application/manifest+json
  application/xml
  font/woff2
  image/svg+xml
  text/css
  text/plain;
